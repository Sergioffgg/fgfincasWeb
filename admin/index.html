<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Panel de Administración | fg fincas</title>
  <style>
    /* Toque corporativo en la pantalla de inicio de sesión */
    button[class*="LoginButton"] {
      background-color: #6b1d2a !important;
      border-radius: 8px !important;
    }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Vista previa personalizada en tiempo real de las tarjetas de noticias
    const NoticiasPreview = createClass({
      render: function () {
        const entry = this.props.entry;
        const noticias = entry.getIn(['data', 'noticias']);
        if (!noticias) return h('p', { style: { padding: '20px', fontFamily: 'sans-serif' } }, 'Añade una noticia para ver la vista previa.');

        return h('div', {
          style: {
            display: 'grid',
            gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))',
            gap: '20px',
            padding: '24px',
            background: '#f4f4f2',
            fontFamily: 'system-ui, -apple-system, sans-serif'
          }
        },
          noticias.map((item, idx) => {
            const titulo = item.get('titulo') || 'Sin título';
            const fecha = item.get('fecha') || 'Sin fecha';
            const urgente = item.get('urgente');
            const imgPath = item.get('imagen');
            const imgUrl = imgPath ? this.props.getAsset(imgPath).toString() : '';

            return h('div', {
              key: idx,
              style: {
                background: '#1a1a1a',
                color: '#fff',
                borderRadius: '14px',
                overflow: 'hidden',
                boxShadow: '0 10px 25px rgba(0,0,0,0.15)',
                borderBottom: '4px solid #7a1c2b'
              }
            },
              imgUrl && h('img', {
                src: imgUrl,
                style: { width: '100%', height: '160px', objectFit: 'cover', display: 'block' }
              }),
              h('div', { style: { padding: '16px' } },
                urgente && h('span', {
                  style: {
                    display: 'inline-block',
                    background: '#9e1b32',
                    color: '#fff',
                    fontSize: '11px',
                    fontWeight: '700',
                    padding: '2px 8px',
                    borderRadius: '4px',
                    marginBottom: '8px',
                    textTransform: 'uppercase'
                  }
                }, 'Urgente'),
                h('div', { style: { fontSize: '12px', color: '#bbb', marginBottom: '6px' } }, fecha),
                h('div', { style: { fontSize: '16px', fontWeight: '600', lineHeight: '1.35' } }, titulo)
              )
            );
          })
        );
      }
    });

    CMS.registerPreviewTemplate('noticias', NoticiasPreview);
  </script>
</body>
</html>
